<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ka-Lai 💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Evita que la pantalla baje o suba */
        }

        /* Diseño de las fotos esparcidas por el fondo */
        .foto {
            position: absolute;
            width: 25vw; /* Se adaptan al tamaño del celular */
            max-width: 140px; 
            height: 25vw;
            max-height: 140px;
            border: 6px solid white;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1; /* Quedan por detrás del cuadro principal */
            pointer-events: none; /* Evita que las fotos estorben */
        }

        .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Posiciones de cada foto alrededor de la pantalla */
        .f1 { top: 5%; left: 5%; transform: rotate(-10deg); }
        .f2 { top: 8%; right: 5%; transform: rotate(15deg); }
        .f3 { top: 40%; left: -2%; transform: rotate(-5deg); }
        .f4 { top: 45%; right: 2%; transform: rotate(10deg); }
        .f5 { bottom: 8%; left: 8%; transform: rotate(-12deg); }
        .f6 { bottom: 5%; right: 10%; transform: rotate(8deg); }
        .f7 { top: 75%; left: 15%; transform: rotate(5deg); }

        /* Cuadro central con la pregunta */
        .contenedor-principal {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(201, 24, 74, 0.4);
            text-align: center;
            z-index: 10; /* Queda por encima de las fotos */
            max-width: 85%;
        }

        h1 {
            color: #d62828;
            font-size: 2em;
            margin-bottom: 10px;
        }

        p {
            color: #333;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        /* Diseño de los botones */
        .botones {
            position: relative;
            height: 60px;
        }

        button {
            font-size: 1.2em;
            padding: 10px 25px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        #btn-si {
            background-color: #d62828;
            color: white;
            box-shadow: 0 4px 10px rgba(214, 40, 40, 0.3);
        }

        #btn-si:hover {
            background-color: #ba1826;
            transform: scale(1.1);
        }

        #btn-no {
            background-color: #f8edeb;
            color: #d62828;
            position: absolute;
            margin-left: 15px;
        }

        /* Lluvia de corazones (animación) */
        @keyframes fall {
            to { transform: translateY(100vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="foto f1"><img src="IMG_5568.jpg"></div>
    <div class="foto f2"><img src="IMG_5569.jpg"></div>
    <div class="foto f3"><img src="IMG_5570.jpg"></div>
    <div class="foto f4"><img src="IMG_5571.jpg"></div>
    <div class="foto f5"><img src="IMG_5572.jpg"></div>
    <div class="foto f6"><img src="IMG_5573.jpg"></div>
    <div class="foto f7"><img src="IMG_5574.jpg"></div>

    <div class="contenedor-principal" id="cuadro">
        <h1>¿Quieres ser mi San Valentín, Ka-Lai? ❤️</h1>
        <p>Eres mi persona favorita en todo el universo.</p>
        <div class="botones">
            <button id="btn-si" onclick="dijoSi()">¡Sí, obvio!</button>
            <button id="btn-no" onmouseover="escapar()" ontouchstart="escapar()">No</button>
        </div>
    </div>

    <script>
        function escapar() {
            const btnNo = document.getElementById('btn-no');
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 20);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = `${x}px`;
            btnNo.style.top = `${y}px`;
        }

        function dijoSi() {
            const cuadro = document.getElementById('cuadro');
            cuadro.innerHTML = '<h1>¡Sabía que dirías que sí! 🥰</h1><p>Te amo muchísimo. Prepárate para nuestra cita.</p>';
            
            setInterval(() => {
                const corazon = document.createElement("div");
                corazon.innerHTML = "💖";
                corazon.style.position = "fixed";
                corazon.style.left = Math.random() * 100 + "vw";
                corazon.style.top = "-20px";
                corazon.style.fontSize = (Math.random() * 20 + 15) + "px";
                corazon.style.animation = "fall " + (Math.random() * 3 + 2) + "s linear";
                corazon.style.zIndex = "100";
                document.body.appendChild(corazon);
                
                setTimeout(() => corazon.remove(), 5000);
            }, 300);
        }
    </script>
</body>
</html>
